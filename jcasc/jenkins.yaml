#==============================================================================
# JENKINS CONFIGURATION AS CODE
#==============================================================================

#==============================================================================
# CONTROLLER CORE CONFIGURATION
#==============================================================================

jenkins:
  systemMessage: Controller configuration is managed as code.
  numExecutors: 0
  mode: NORMAL
  scmCheckoutRetryCount: 2

  #============================================================================
  # NATIVE SECURITY REALM
  #============================================================================

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}

  #============================================================================
  # AUTHORIZATION STRATEGY
  #============================================================================

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  #============================================================================
  # CONTROLLER ENVIRONMENT
  #============================================================================

  globalNodeProperties:
    - envVars:
        env:
          - key: LANG
            value: C.UTF-8
          - key: LC_ALL
            value: C.UTF-8

  #============================================================================
  # PLATFORM BUILD AGENT
  #============================================================================

  nodes:
    - permanent:
        name: platform-agent
        nodeDescription: Resource-limited Docker build agent on the platform host
        remoteFS: /home/jenkins/agent
        numExecutors: 1
        mode: NORMAL
        labelString: platform docker
        retentionStrategy: always
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: remoting
              failIfWorkDirIsMissing: false

#==============================================================================
# CONTROLLER SECURITY HEADERS
#==============================================================================

security:
  contentSecurityPolicy:
    enforce: true

#==============================================================================
# MANAGED CREDENTIALS
#==============================================================================

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: github-token
              secret: ${GITHUB_TOKEN}
              description: GitHub automation token
          - usernamePassword:
              scope: GLOBAL
              id: github-scm
              username: bharathadigopula
              password: ${GITHUB_TOKEN}
              description: GitHub source control credential

#==============================================================================
# CONTROLLER LOCATION
#==============================================================================

unclassified:
  globalLibraries:
    libraries:
      - name: jenkins-pipeline-templates
        defaultVersion: v1.4.0
        allowVersionOverride: true
        implicit: false
        includeInChangesets: true
        retriever:
          modernSCM:
            scm:
              gitSource:
                remote: https://github.com/bharathadigopula/jenkins-pipeline-templates.git
  location:
    url: ${JENKINS_URL}
  resourceRoot:
    url: ${JENKINS_RESOURCE_ROOT_URL}

#==============================================================================
# MANAGED REPOSITORY JOBS
#==============================================================================

jobs:
  - script: |
      def validationRepositories = [
        [name: 'bharath-oci-host-config', description: 'Private OCI host configuration'],
        [name: 'github-pipeline-templates', description: 'Reusable GitHub workflow templates'],
        [name: 'jenkins-controller-automation', description: 'Jenkins controller automation'],
        [name: 'jenkins-pipeline-templates', description: 'Jenkins shared pipeline library'],
        [name: 'monitoring-stack-automation', description: 'Monitoring stack automation'],
        [name: 'shared-host-automation', description: 'Shared host automation'],
        [name: 'terraform-oci-modules', description: 'Shared OCI Terraform modules'],
        [name: 'tf-bharath-oci-infra', description: 'OCI production Terraform infrastructure']
      ]
      validationRepositories.each { repositoryConfig ->
        folder(repositoryConfig.name) {
          displayName(repositoryConfig.name)
          description(repositoryConfig.description)
        }
        multibranchPipelineJob(repositoryConfig.name + '/validate') {
          description('Automatic main and pull request validation for ' + repositoryConfig.name)
          branchSources {
            github {
              id(repositoryConfig.name + '-validation')
              scanCredentialsId('github-scm')
              checkoutCredentialsId('github-scm')
              repoOwner('bharathadigopula')
              repository(repositoryConfig.name)
              includes('main')
              excludes('')
              buildOriginBranch(true)
              buildOriginBranchWithPR(false)
              buildOriginPRHead(true)
              buildOriginPRMerge(false)
              buildForkPRHead(false)
              buildForkPRMerge(false)
            }
          }
          factory {
            workflowBranchProjectFactory {
              scriptPath('.jenkins/pipelines/validate.groovy')
            }
          }
          orphanedItemStrategy {
            discardOldItems {
              numToKeep(20)
            }
          }
          triggers {
            periodicFolderTrigger {
              interval('5m')
            }
          }
        }
      }
  - script: >
      pipelineJob('bharath-oci-host-config/configure-jenkins') {
        description('Repository-managed Jenkins controller lifecycle')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/bharath-oci-host-config.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/jenkins-controller.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('bharath-oci-host-config/configure-monitoring') {
        description('Repository-managed monitoring stack lifecycle')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/bharath-oci-host-config.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/monitoring-stack.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('tf-bharath-oci-infra/operate-infrastructure') {
        description('Repository-managed OCI production Terraform lifecycle')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/tf-bharath-oci-infra.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/production-infrastructure.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('bharath-oci-host-config/operate-host-network') {
        description('Repository-managed production secondary IP lifecycle')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/bharath-oci-host-config.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/host-network.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('bharath-oci-host-config/operate-ingress-connector') {
        description('Repository-managed production Cloudflare connector lifecycle')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/bharath-oci-host-config.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/ingress-connector.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('jenkins-controller-automation/scheduled-validation') {
        description('Daily validation of Jenkins controller version pins')
        properties {
          pipelineTriggers {
            triggers {
              cron {
                spec('17 3 * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/jenkins-controller-automation.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/validate.groovy')
            lightweight(true)
          }
        }
      }
  - script: >
      pipelineJob('monitoring-stack-automation/scheduled-validation') {
        description('Daily validation of monitoring stack version pins')
        properties {
          pipelineTriggers {
            triggers {
              cron {
                spec('29 3 * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/bharathadigopula/monitoring-stack-automation.git')
                  credentials('github-scm')
                }
                branch('*/main')
              }
            }
            scriptPath('.jenkins/pipelines/validate.groovy')
            lightweight(true)
          }
        }
      }