#==============================================================================
# LOW RESOURCE JENKINS CONTROLLER
#==============================================================================

#==============================================================================
# STACK IDENTITY
#==============================================================================

name: jenkins-controller

#==============================================================================
# CONTROLLER SERVICES
#==============================================================================

services:
  #============================================================================
  # JENKINS CONTROLLER SERVICE
  #============================================================================

  jenkins:
    #==========================================================================
    # CONTROLLER IMAGE BUILD
    #==========================================================================

    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-controller:${JENKINS_CONTROLLER_VERSION:-2.568.3-lts-jdk21}

    #==========================================================================
    # CONTROLLER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 2048M

    #=========================================================================
    # CONTROLLER RUNTIME ENVIRONMENT
    #=========================================================================

    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_config/jenkins.yaml
      COLLECTING_METRICS_PERIOD_IN_SECONDS: "120"
      JAVA_OPTS: -Xms512m -Xmx1024m -XX:+UseG1GC -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_OPTS: --httpPort=8080
      JENKINS_RESOURCE_ROOT_URL: ${JENKINS_RESOURCE_ROOT_URL:-http://jenkins-resources.localhost:8080}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080}

    #==========================================================================
    # CONTROLLER NETWORK, SECRETS, AND STORAGE
    #==========================================================================

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - ${JENKINS_BIND_ADDRESS:-127.0.0.1}:8080:8080
    restart: unless-stopped
    secrets:
      - github_token
      - jenkins_admin_password
    volumes:
      - ./jcasc:/var/jenkins_config:ro
      - jenkins-home:/var/jenkins_home

  #============================================================================
  # PLATFORM AGENT SECRET BOOTSTRAP
  #============================================================================

  platform-agent-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: jenkins-platform-agent:3386.v353e57a_1b_ea_0-2-jdk21
    command: ["bootstrap"]
    depends_on:
      jenkins:
        condition: service_healthy
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_AGENT_NAME: platform-agent
      JENKINS_URL: http://jenkins:8080
    restart: "no"
    user: "0:0"
    secrets:
      - jenkins_admin_password
    volumes:
      - jenkins-agent-secret:/run/jenkins-agent-secret

  #============================================================================
  # PLATFORM BUILD AGENT
  #============================================================================

  platform-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: jenkins-platform-agent:3386.v353e57a_1b_ea_0-2-jdk21
    depends_on:
      platform-agent-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
    environment:
      JENKINS_AGENT_NAME: platform-agent
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_URL: http://jenkins:8080
      JENKINS_WEB_SOCKET: "true"
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-agent-secret:/run/jenkins-agent-secret:ro
      - jenkins-agent-workspace:/home/jenkins/agent

  #==============================================================================
  # CONTROLLER SECRETS
  #==============================================================================

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-./secrets/github-token}
  jenkins_admin_password:
    file: ${JENKINS_ADMIN_PASSWORD_FILE:-./secrets/jenkins-admin-password}

#==============================================================================
# CONTROLLER PERSISTENT VOLUMES
#==============================================================================

volumes:
  jenkins-agent-secret:
  jenkins-agent-workspace:
  jenkins-home: