#==============================================================================
# JENKINS CONTROLLER VALIDATION
#==============================================================================

#==============================================================================
# WORKFLOW IDENTITY
#==============================================================================

name: Validate Jenkins controller

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# WORKFLOW CONCURRENCY
#==============================================================================

concurrency:
  group: jenkins-controller-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# CONTROLLER VALIDATION JOB
#==============================================================================

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Bash
        run: shellcheck scripts/*.sh

      - name: Validate controller configuration
        run: bash scripts/validate.sh

      - name: Validate dry run
        run: bash scripts/manage.sh dry-run

      - name: Validate bootstrap payload size
        run: test "$(wc -c < scripts/bootstrap.sh)" -le 4096

      - name: Build controller image
        run: docker compose build